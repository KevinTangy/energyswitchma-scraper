name: Daily EnergySwitch scrape

on:
  schedule:
    - cron: "11 11 * * *"   # 11:11 UTC = 6:11 AM EST / 7:11 AM EDT (GitHub cron is UTC only)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright matplotlib
          python -m playwright install --with-deps chromium

      # One city failing doesn't stop the others; the step fails at the end
      # if any city came back empty, so you'll get a GitHub alert.
      # PAUSE_SECONDS spaces out requests to energyswitchma.gov (not after
      # the last city).
      - name: Scrape all cities
        env:
          PAUSE_SECONDS: 15
        run: |
          failed=""
          first=1
          while IFS=: read -r zip city; do
            [ -z "$zip" ] && continue
            [ "$first" = 1 ] || sleep "$PAUSE_SECONDS"
            first=0
            python scrape.py "$zip" --city "$city" || failed="$failed $city"
          done <<'EOF'
          02148:Malden
          02155:Medford
          02176:Melrose
          02149:Everett
          02151:Revere
          01906:Saugus
          EOF
          echo "FAILED=$failed" >> "$GITHUB_ENV"

      - name: Build charts and README
        run: python make_charts.py

      - name: Commit results
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add data charts README.md
          git diff --cached --quiet || git commit -m "Rates for $(TZ=America/New_York date +%F)"
          git push

      - name: Report failures
        if: env.FAILED != ''
        run: |
          echo "No offers found for:$FAILED"
          exit 1

