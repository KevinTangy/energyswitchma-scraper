name: Daily EnergySwitch scrape

on:
  schedule:
    # Two runs a day, Eastern time all year. GitHub reads cron as UTC unless a
    # timezone is given; with an IANA timezone it follows daylight saving.
    # GitHub may delay or drop scheduled runs when it's busy, so a run can
    # start late; workflow_dispatch below is the manual fallback.
    # If both run on the same day, the second replaces that day's rows
    # (no duplicates).
    - cron: "5 2 * * *"      # 2:05 AM Eastern
      timezone: "America/New_York"
    - cron: "11 11 * * *"    # 11:11 AM Eastern
      timezone: "America/New_York"
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write

# One run at a time: a run that starts while another is going waits for it,
# so two runs never push data at the same moment.
concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright matplotlib
          python -m playwright install --with-deps chromium

      # Cities come from cities.csv (zip,city,compare_id). compare_id picks the
      # utility's page: 1 = National Grid, 2 = Eversource (see probe.py).
      # One city failing doesn't stop the others; the step fails at the end
      # if any city came back empty, so you'll get a GitHub alert.
      # PAUSE_SECONDS spaces out requests to energyswitchma.gov (not after
      # the last city).
      - name: Scrape all cities
        env:
          PAUSE_SECONDS: 15
        run: |
          failed=""
          first=1
          while IFS=, read -r zip city compare_id; do
            zip="${zip//[$'\r ']/}"; compare_id="${compare_id//[$'\r ']/}"
            [ -z "$zip" ] && continue
            [ "$first" = 1 ] || sleep "$PAUSE_SECONDS"
            first=0
            python scrape.py "$zip" --city "$city" --compare-id "${compare_id:-1}" || failed="$failed $city"
          done < <(tail -n +2 cities.csv)
          echo "FAILED=$failed" >> "$GITHUB_ENV"

      - name: Build charts and README
        run: python make_charts.py

      - name: Commit results
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add data charts README.md
          git diff --cached --quiet || git commit -m "Rates for $(TZ=America/New_York date +%F)"
          git pull --rebase   # in case main changed while this run was scraping
          git push

      - name: Report failures
        if: env.FAILED != ''
        run: |
          echo "No offers found for:$FAILED"
          exit 1

